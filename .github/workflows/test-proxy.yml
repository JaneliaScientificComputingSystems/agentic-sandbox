# The allowlist proxy's tests need no cluster, no bwrap and no network (see tests/test-proxy.py).
# The same holds for tests/test-csub-policy.sh, which runs csub-policy.sh against a stand-in sample.
# The wrapper suites (tests/test-bwrap.sh, tests/test-podman.sh) need an LSF node and stay manual.
name: test-proxy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # Static checks of every shell script, at shellcheck's warning level. It does not catch a
  # failing command inside a trap under `set -e`, which is what most wrapper bugs have been, but
  # it does catch unchecked `cd`, masked return values and unquoted lists in new code.
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
  test-proxy:
    runs-on: ubuntu-24.04   # ubuntu-latest moved to 26.04, which has no Python 3.9; the cluster runs 3.9
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 tests/test-proxy.py
      - run: for f in scripts/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - run: bash tests/test-csub-policy.sh
